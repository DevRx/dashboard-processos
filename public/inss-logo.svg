<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110" role="img" aria-label="INSS — Instituto Nacional do Seguro Social">
  <title>INSS — Instituto Nacional do Seguro Social</title>
  <defs>
    <linearGradient id="seloInss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a6fd4"/>
      <stop offset="1" stop-color="#0c3f80"/>
    </linearGradient>
  </defs>

  <!-- Selo: a proteção social como guarda-chuva sobre o segurado -->
  <rect x="6" y="11" width="88" height="88" rx="19" fill="url(#seloInss)"/>
  <path d="M16 56C16 34.5 30.3 22 50 22s34 12.5 34 34q-8.5-9.5-17 0-8.5-9.5-17 0-8.5-9.5-17 0-8.5-9.5-17 0Z" fill="#ffffff"/>
