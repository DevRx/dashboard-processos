  <circle cx="50" cy="34" r="6.5" fill="#1a6fd4"/>
  <rect x="20" y="86" width="60" height="5" rx="2.5" fill="#168821"/>

  <!-- Assinatura institucional -->
  <text x="112" y="63" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="1.5" fill="#0c3f80">INSS</text>
  <text x="114" y="85" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.35" fill="#5b6b7c">Instituto Nacional do Seguro Social</text>
</svg>
